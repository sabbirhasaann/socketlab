<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Home Page</title>
</head>

<body>
    <h1>Welcome to Chat Home Page</h1>
    <h2>You can find the following channes</h2>

    <ul>
        {% for channel in channels %}
        <li>
            <a href="channels/{{channel}}/">{{channel|capfirst}}</a>
        </li>
        {% endfor %}
    </ul>
</body>

</html>
